version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: surge_ride_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surge-ride-db
    volumes:
      - ./pg-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: surgeride_redis
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: surgeride_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  prometheus:
    image: prom/prometheus:latest
    container_name: surgeride_prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
      image: grafana/grafana:latest
      container_name: surgeride_grafana
      ports:
        - "3000:3000"
      environment:
        - GF_SECURITY_ADMIN_PASSWORD=admin
      depends_on:
        - prometheus