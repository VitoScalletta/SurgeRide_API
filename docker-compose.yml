version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: surge_ride_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surge-ride-db
    volumes:
      - ./pg-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: surgeride_redis
    ports:
      - "6379:6379"